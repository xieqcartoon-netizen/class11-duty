name: Daily Duty Reminder

on:
  schedule:
    # 每天北京时间早上 8:00 (UTC 时间 0:00) 自动触发
    - cron: '0 0 * * *'
  workflow_dispatch: # 保持开启，支持随时手动点击运行

jobs:
  run-reminder:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright pandas openpyxl requests

      - name: Install Playwright Chromium Browser
        run: python -m playwright install chromium

      - name: Run Duty Reminder Script
        env:
          TENCENT_COOKIE: ${{ secrets.TENCENT_COOKIE }}
        run: python get_duty_reminder.py
