name: Daily Duty Reminder

on:
  schedule:
    # 北京时间早上 8:00 自动触发
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  run-reminder:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # 增加安装 pandas 和 openpyxl 用于完美读取 Excel 文件
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl requests

      - name: Run script
        env:
          WECHAT_APPID: ${{ secrets.WECHAT_APPID }}
          WECHAT_APPSECRET: ${{ secrets.WECHAT_APPSECRET }}
          WECHAT_OPENID: ${{ secrets.WECHAT_OPENID }}
          WECHAT_TEMPLATE_ID: ${{ secrets.TEMPLATE_ID }}
          TENCENT_COOKIE: ${{ secrets.TENCENT_COOKIE }}
        run: python get_duty_reminder.py
