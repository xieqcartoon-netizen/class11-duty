name: Daily Duty Reminder

on:
  schedule:
    # 北京时间早上 8:00 自动触发
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  run-reminder:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Run script
        run: python get_duty_reminder.py
